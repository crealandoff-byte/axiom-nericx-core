[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Les fonctions synchrones de Netlify ont une durée limitée.
# Le noyau borne donc ses appels ; les gros traitements GPU et les
# serveurs de jeu persistants devront aller sur un service adapté.
[functions."chat"]
  timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
